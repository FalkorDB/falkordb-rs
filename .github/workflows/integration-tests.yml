name: Integration Tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  # Daily run against the `edge` image to catch breaking changes in upcoming
  # FalkorDB releases before they reach a stable release.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      falkordb_image_tag:
        description: "FalkorDB Docker image tag to test against (defaults to latest)"
        required: false
        default: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Retry transient crates.io download failures and avoid HTTP/2 "unexpected eof" errors.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  FALKORDB_HOST: 127.0.0.1
  FALKORDB_PORT: 6379

jobs:
  # Single source of truth for the FalkorDB image tag. It cannot be a plain
  # `env:` variable because GitHub does not allow the `env` context in
  # `jobs.<id>.services.<id>.image`, so it is resolved once here and consumed
  # via `needs.falkordb-version.outputs.version`.
  falkordb-version:
    name: Resolve FalkorDB version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        env:
          # Released `latest` for pull requests, pushes and tags; `edge` for the
          # scheduled daily run; an explicit tag on manual dispatch.
          FALKORDB_VERSION: ${{ github.event.inputs.falkordb_image_tag || (github.event_name == 'schedule' && 'edge' || 'latest') }}
        run: |
          echo "Testing against falkordb/falkordb:$FALKORDB_VERSION"
          echo "version=$FALKORDB_VERSION" >> "$GITHUB_OUTPUT"

  integration-tests:
    runs-on: ubuntu-latest
    needs: falkordb-version

    services:
      falkordb:
        # Tag resolved by the `falkordb-version` job above.
        image: falkordb/falkordb:${{ needs.falkordb-version.outputs.version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install Rust
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - uses: taiki-e/install-action@88ada01c46e65c47040a0ae865537cc76fcd0e1c # just
        with:
          tool: just

      - name: Install redis-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Wait for FalkorDB to be ready
        run: |
          echo "Waiting for FalkorDB to be ready..."
          for i in {1..30}; do
            if redis-cli -h 127.0.0.1 -p 6379 ping > /dev/null 2>&1; then
              echo "FalkorDB is ready!"
              break
            fi
            echo "Attempt $i: FalkorDB not ready yet..."
            sleep 2
          done
          redis-cli -h 127.0.0.1 -p 6379 ping

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Cache only dependency sources (registry/git), not target/ or ~/.cargo/bin:
          # prevents the crates.io refetch that flaked, with no stale-artifact risk.
          cache-targets: "false"
          cache-bin: "false"

      - name: Run integration tests
        run: just integration

      - name: Run integration tests with all features
        run: just integration --all-features

  integration-tests-tokio:
    runs-on: ubuntu-latest
    needs: falkordb-version

    services:
      falkordb:
        # Tag resolved by the `falkordb-version` job above.
        image: falkordb/falkordb:${{ needs.falkordb-version.outputs.version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install Rust
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - uses: taiki-e/install-action@88ada01c46e65c47040a0ae865537cc76fcd0e1c # just
        with:
          tool: just

      - name: Install redis-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Wait for FalkorDB to be ready
        run: |
          echo "Waiting for FalkorDB to be ready..."
          for i in {1..30}; do
            if redis-cli -h 127.0.0.1 -p 6379 ping > /dev/null 2>&1; then
              echo "FalkorDB is ready!"
              break
            fi
            echo "Attempt $i: FalkorDB not ready yet..."
            sleep 2
          done
          redis-cli -h 127.0.0.1 -p 6379 ping

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Cache only dependency sources (registry/git), not target/ or ~/.cargo/bin:
          # prevents the crates.io refetch that flaked, with no stale-artifact risk.
          cache-targets: "false"
          cache-bin: "false"

      - name: Run async integration tests
        run: just integration --features tokio

  # A cron job has nobody watching it: GitHub only emails whoever last touched
  # the cron line, so a failing daily run would otherwise go unnoticed. The
  # reporter is shared with the other FalkorDB clients, which all need the same
  # alert; `permissions` has to stay here because a called workflow can only
  # downgrade the caller's token.
  report-scheduled-failure:
    name: Report scheduled failure
    needs: [falkordb-version, integration-tests, integration-tests-tokio]
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    permissions:
      issues: write
    # Pinned, and only the one secret it declares is passed: a mutable ref
    # plus `secrets: inherit` would let a later upstream change run with this
    # repo's secrets. Dependabot keeps the pin current.
    uses: FalkorDB/.github/.github/workflows/report-scheduled-failure.yml@126ec30105d98bdfb62b5631e92aa149fc0e5ad1 # 2026-08-13
    secrets:
      DRIVERS_GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.DRIVERS_GOOGLE_CHAT_WEBHOOK_URL }}
